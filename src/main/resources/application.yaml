spring:
  application:
    name: vacancyradar

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/vcradar}
    username: ${DB_USER:vcradar}
    password: ${DB_PASSWORD:vcradar}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

management:
  endpoints:
    web:
      exposure:
        include: health,info


