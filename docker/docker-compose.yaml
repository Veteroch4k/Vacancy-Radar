name: vacancyradar

services:
  postgres:
    image: postgres:17-alpine
    container_name: vcradar_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-vcradar}
      POSTGRES_USER: ${DB_USER:-vcradar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vcradar}
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vcradar} -d ${DB_NAME:-vcradar}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data: